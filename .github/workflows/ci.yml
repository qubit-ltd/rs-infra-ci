name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install sccache
        id: sccache
        if: env.RS_INFRA_SCCACHE != '0'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          version: v0.20.1
      - name: Enable Rust compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            if [[ ! -v RUSTC_WRAPPER && ! -v RUSTC_WORKSPACE_WRAPPER && ! -v CARGO_BUILD_RUSTC_WRAPPER && ! -v CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER ]]; then
              echo 'RUSTC_WRAPPER=sccache'
              echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL-0}"
              echo "SCCACHE_ALLOW_INCREMENTAL=${SCCACHE_ALLOW_INCREMENTAL-1}"
            fi
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=${SCCACHE_IGNORE_SERVER_IO_ERROR-1}"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rustfmt
      - name: Install pinned nightly components
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Test CI entrypoint locking
        run: python3 tests/ci_check_lock_tests.py
      - run: ./.infra/bin/align-ci.sh
      - run: ./.infra/bin/ci-check.sh
