name: Shared Rust CI

on:
  workflow_call:
    inputs:
      verify-os:
        description: JSON array of runners for the verify job
        type: string
        default: '["ubuntu-latest"]'
      memory-check-os:
        description: JSON array of Linux/macOS runners for opted-in Miri and AddressSanitizer checks
        type: string
        default: '["ubuntu-latest"]'
      feature-test-os:
        description: JSON array of runners for additional no-default/all-features tests
        type: string
        default: '[]'
      cross-targets:
        description: JSON array of compile-only Rust targets
        type: string
        default: '[]'
      contract-tests:
        description: JSON array of integration test target names
        type: string
        default: '[]'
      fuzz-check:
        description: Compile fuzz targets with warnings denied
        type: boolean
        default: false
      fuzz-max-len:
        description: Maximum fuzz input length for the infrastructure suite
        type: string
        default: '4096'
      verify-extra-script:
        description: Additional verification commands after installing the legacy toolchain
        type: string
        default: ''
      feature-matrix-prefetch:
        description: Fetch locked dependencies before the feature matrix
        type: boolean
        default: false
      feature-matrix-enabled:
        description: Validate and run the configured feature matrix
        type: boolean
        default: true
      feature-matrix-max-parallel:
        description: Maximum number of concurrent feature matrix checks
        type: number
        default: 4
      derive-coverage:
        description: Run derive macro coverage checks and require them for Pages
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - &install-sccache
        name: Install sccache
        id: sccache
        if: env.RS_INFRA_SCCACHE != '0'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          version: v0.20.1
      - &enable-sccache
        name: Enable Rust compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            if [[ ! -v RUSTC_WRAPPER && ! -v RUSTC_WORKSPACE_WRAPPER && ! -v CARGO_BUILD_RUSTC_WRAPPER && ! -v CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER ]]; then
              echo 'RUSTC_WRAPPER=sccache'
              echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL-0}"
              echo "SCCACHE_ALLOW_INCREMENTAL=${SCCACHE_ALLOW_INCREMENTAL-1}"
            fi
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=${SCCACHE_IGNORE_SERVER_IO_ERROR-1}"
          } >> "$GITHUB_ENV"
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Check dependency baseline
        run: ./.infra/bin/dependency-update.sh --check

  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.verify-os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Install Rustfmt toolchain
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Install project build toolchain
        # Project hooks may run cargo clippy with the project's default toolchain.
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-src --component clippy
      - name: Run infrastructure CI orchestration
        run: ./.infra/bin/ci-check.sh --only=verify
      - name: Run style, hook, and coverage Clippy
        if: runner.os == 'Linux'
        run: ./.infra/bin/ci-check.sh --only=style,clippy,coverage-cfg-clippy,project-hook
      - name: Install Clippy toolchain on additional platforms
        if: runner.os != 'Linux'
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component clippy
      - name: Run Clippy on additional platforms
        if: runner.os != 'Linux'
        run: ./.infra/bin/ci-check.sh --only=clippy
      - name: Run additional verification commands
        if: inputs.verify-extra-script != ''
        env:
          VERIFY_EXTRA_SCRIPT: ${{ inputs.verify-extra-script }}
        run: bash -e -o pipefail -c "$VERIFY_EXTRA_SCRIPT"
      - name: Run documentation tests
        run: cargo +1.94.0 test --doc --verbose
      - name: Run README dependency-version check
        run: ./.infra/bin/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite readme
      - name: Install documentation toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-src
      - name: Generate strict all-features documentation
        run: RUSTDOCFLAGS="-D warnings -D missing-docs" cargo +1.94.0 doc --all-features --no-deps --verbose
      - name: Upload documentation artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc
          retention-days: 14
          if-no-files-found: error

  feature-matrix-plan:
    if: inputs.feature-matrix-enabled
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-checks: ${{ steps.plan.outputs.has-checks }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Validate and plan feature matrix
        id: plan
        run: |
          ./.infra/bin/infra-tool.sh rs-infra-ci --project "$GITHUB_WORKSPACE" matrix plan \
            --output "$RUNNER_TEMP/feature-matrix.json" \
            --runner-output "$RUNNER_TEMP/rs-infra-ci/rs-infra-ci"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/feature-matrix.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' "$RUNNER_TEMP/feature-matrix.json")" -gt 0 ]; then
            echo 'has-checks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-checks=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch locked dependencies for feature matrix
        if: inputs.feature-matrix-prefetch && steps.plan.outputs.has-checks == 'true'
        run: cargo +1.94.0 fetch --locked
      - name: Package matrix runner and prefetched dependencies
        if: steps.plan.outputs.has-checks == 'true'
        run: |
          tar -czf "$RUNNER_TEMP/rs-infra-ci.tar.gz" -C "$RUNNER_TEMP/rs-infra-ci" rs-infra-ci
          if [ '${{ inputs.feature-matrix-prefetch }}' = 'true' ]; then
            cargo_home_dir="${CARGO_HOME:-$HOME/.cargo}"
            mkdir -p "$cargo_home_dir/registry" "$cargo_home_dir/git"
            tar -czf "$RUNNER_TEMP/cargo-sources.tar.gz" -C "$cargo_home_dir" registry git
          fi
      - name: Upload matrix runner and dependencies
        if: steps.plan.outputs.has-checks == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: feature-matrix-runner
          path: |
            ${{ runner.temp }}/rs-infra-ci.tar.gz
            ${{ runner.temp }}/cargo-sources.tar.gz
          retention-days: 1
          if-no-files-found: error

  feature-matrix:
    if: needs.feature-matrix-plan.outputs.has-checks == 'true'
    needs: [feature-matrix-plan]
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.feature-matrix-max-parallel }}
      matrix: ${{ fromJSON(needs.feature-matrix-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Install matrix build toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rust-src
      - name: Install matrix Clippy toolchain when required
        if: matrix.needs_clippy
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component clippy
      - uses: actions/download-artifact@v8
        with:
          name: feature-matrix-runner
          path: ${{ runner.temp }}/feature-matrix-runner
      - name: Restore matrix runner and prefetched dependencies
        run: |
          tar -xzf "$RUNNER_TEMP/feature-matrix-runner/rs-infra-ci.tar.gz" -C "$RUNNER_TEMP/feature-matrix-runner"
          if [ -f "$RUNNER_TEMP/feature-matrix-runner/cargo-sources.tar.gz" ]; then
            cargo_home_dir="${CARGO_HOME:-$HOME/.cargo}"
            mkdir -p "$cargo_home_dir"
            tar -xzf "$RUNNER_TEMP/feature-matrix-runner/cargo-sources.tar.gz" -C "$cargo_home_dir"
          fi
      - name: Run selected feature matrix check
        env:
          MATRIX_CHECK: ${{ matrix.name }}
        run: '"$RUNNER_TEMP/feature-matrix-runner/rs-infra-ci" --project "$GITHUB_WORKSPACE" matrix run --check "$MATRIX_CHECK"'

  coverage:
    needs: [verify]
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect and check coverage
        env:
          # Rust 1.94 non-incremental coverage can lose counters for inline functions.
          CARGO_INCREMENTAL: "1"
        run: ./.infra/bin/coverage.sh
      - name: Build project (release)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rust-src
          cargo +1.94.0 build --release --verbose
      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rs-infra-coverage-report -->';
            const body = marker + '\n' + fs.readFileSync('coverage-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.txt
            coverage.json
            coverage-badge.json
            coverage-summary.md
            ci-summary.json
            target/llvm-cov/html
            target/llvm-cov/cobertura.xml
          retention-days: 14
          if-no-files-found: error

  derive-coverage:
    if: inputs.derive-coverage
    name: Derive coverage
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview, rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Validate Cargo path dependencies
        run: cargo +1.94.0 metadata --locked --format-version 1
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect and check derive coverage
        run: ./scripts/check-derive-coverage.sh
      - name: Upload derive coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: derive-coverage-reports
          path: target/derive-coverage
          retention-days: 14
          if-no-files-found: error

  pages:
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.verify.result == 'success' && needs.coverage.result == 'success' && (needs.feature-matrix-plan.result == 'success' || (!inputs.feature-matrix-enabled && needs.feature-matrix-plan.result == 'skipped')) && (needs.feature-matrix.result == 'success' || needs.feature-matrix.result == 'skipped') && (needs.derive-coverage.result == 'success' || (!inputs.derive-coverage && needs.derive-coverage.result == 'skipped')) }}
    needs: [verify, feature-matrix-plan, feature-matrix, coverage, derive-coverage]
    outputs:
      deploy: ${{ steps.pages-config.outputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Validate Pages configuration
        id: pages-config
        run: |
          jq -e '.deploy | type == "boolean"' .infra/pages/pages.json >/dev/null
          echo "deploy=$(jq -r .deploy .infra/pages/pages.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: .
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Build Pages site
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" build
      - name: Prepare Pages artifact
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" artifact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pages-deploy:
    if: ${{ always() && needs.pages.result == 'success' && needs.pages.outputs.deploy == 'true' }}
    needs: [pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  advanced-verification-plan:
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Plan configured infrastructure suites
        id: plan
        env:
          MEMORY_CHECK_OS: ${{ inputs.memory-check-os }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          root = Path(os.environ['GITHUB_WORKSPACE'])
          runners = json.loads(os.environ['MEMORY_CHECK_OS'])
          if not isinstance(runners, list) or not runners or any(
              not isinstance(r, str) or not r.startswith(('ubuntu-', 'macos-')) for r in runners
          ):
              raise ValueError('memory-check-os must be a nonempty JSON array of Ubuntu/macOS runners')
          metadata = json.loads(subprocess.check_output(
              ['cargo', 'metadata', '--no-deps', '--format-version', '1'], cwd=root, text=True
          ))
          members = set(metadata['workspace_members'])
          enabled = {'audit'}
          for package in metadata['packages']:
              if package['id'] not in members:
                  continue
              md = package.get('metadata') or {}
              cfg = md.get('rs-infra', md.get('rs-ci', {}))
              if not isinstance(cfg, dict):
                  raise ValueError('package infrastructure metadata must be a table')
              miri = cfg.get('miri', False)
              if not isinstance(miri, bool):
                  raise ValueError('miri must be a boolean')
              sanitizers = cfg.get('sanitizers', [])
              if not isinstance(sanitizers, list) or any(s != 'address' for s in sanitizers) or len(sanitizers) > 1:
                  raise ValueError('sanitizers must be an array containing at most one address entry')
              if miri:
                  enabled.add('miri')
              if 'address' in sanitizers:
                  enabled.add('address-sanitizer')
              if any(dep.get('name') == 'loom' for dep in package.get('dependencies', [])):
                  enabled.add('loom')
          for suite, paths in {
              'cross': ['.infra/ci/cross.toml', 'Cross.toml', '.rs-ci-cross.toml'],
              'platform': ['.infra/ci/platform.toml', '.rs-ci-platform.toml'],
          }.items():
              if any((root / path).is_file() for path in paths):
                  enabled.add(suite)
          fuzz_manifest = root / 'fuzz/Cargo.toml'
          if fuzz_manifest.is_file():
              fuzz = tomllib.loads(fuzz_manifest.read_text())
              if fuzz.get('package', {}).get('metadata', {}).get('cargo-fuzz') is True:
                  enabled.add('fuzz')
          matrix = {'include': [
              {'suite': suite, 'os': runner}
              for suite in ['miri', 'address-sanitizer', 'loom', 'fuzz', 'audit', 'cross', 'platform']
              if suite in enabled
              for runner in (list(dict.fromkeys(runners)) if suite in {'miri', 'address-sanitizer'} else ['ubuntu-latest'])
          ]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PYTHON

  advanced-verification:
    name: Infrastructure suite (${{ matrix.suite }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [advanced-verification-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.advanced-verification-plan.outputs.matrix) }}
    env:
      RS_INFRA_NIGHTLY_TOOLCHAIN: nightly-2026-06-05
      RS_INFRA_FUZZ_MODE: smoke
      RS_INFRA_FUZZ_SECONDS_PER_TARGET: "10"
      RS_INFRA_FUZZ_MAX_LEN: ${{ inputs.fuzz-max-len }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Install suite-specific tools
        if: matrix.suite != 'fuzz' || env.RS_INFRA_FUZZ_MODE != 'disabled'
        run: |
          case "${{ matrix.suite }}" in
            audit) cargo install cargo-audit --locked ;;
            fuzz)
              rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal
              cargo install cargo-fuzz --locked --version 0.13.2
              ;;
            cross) cargo install cross --locked ;;
            miri)
              rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal --component miri,rust-src
              cargo +"$RS_INFRA_NIGHTLY_TOOLCHAIN" miri setup
              ;;
            address-sanitizer) rustup toolchain install "$RS_INFRA_NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src ;;
          esac
      - name: Run configured infrastructure suite
        run: |
          if [ "${{ matrix.suite }}" = "loom" ]; then
            export RUSTFLAGS="--cfg loom"
          fi
          ./.infra/bin/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite "${{ matrix.suite }}"
      - name: Upload fuzz crash artifacts
        if: ${{ failure() && matrix.suite == 'fuzz' }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  cross-targets:
    if: inputs.cross-targets != '[]'
    name: Compile-only ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.cross-targets) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Install Rust target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup toolchain install 1.94 --profile minimal --target "$RUST_TARGET"
      - name: Compile-only check target
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: cargo +1.94 check --target "$RUST_TARGET"

  feature-tests:
    if: inputs.feature-test-os != '[]'
    name: Feature tests (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.feature-test-os) }}
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal
      - name: Run feature tests
        run: cargo +1.94 test --locked ${{ matrix.features }} --no-fail-fast

  contract-tests:
    if: inputs.contract-tests != '[]'
    name: Integration test (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(inputs.contract-tests) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal
      - name: Run integration test
        env:
          TEST_TARGET: ${{ matrix.test }}
        run: cargo +1.94 test --all-features --locked --test "$TEST_TARGET"

  fuzz-check:
    if: inputs.fuzz-check
    name: Fuzz target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - *install-sccache
      - *enable-sccache
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal
      - name: Check fuzz targets with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.94 check --locked --manifest-path fuzz/Cargo.toml --bins
